openapi: 3.0.3
info:
  title: Community Events Board Authentication API
  version: 1.0.0
  description: |
    JSON-only authentication for web and mobile clients. Send access JWTs in
    Authorization: Bearer headers. Refresh tokens are opaque, single-use secrets;
    refreshing rotates them and reusing one revokes its entire session.
    Sessions expire absolutely after seven days. No cookies are set or accepted.
    All responses have Cache-Control: no-store and X-Request-Id headers.
servers:
  - url: http://localhost:3000
tags:
  - name: Authentication
    description: Account creation and token lifecycle.
paths:
  /api/auth/signup:
    post:
      tags: [Authentication]
      operationId: signUp
      summary: Create a visitor account and session
      description: Email is trimmed and lowercased. Passwords are 12–128 characters and are never trimmed. Extra fields, including role, are rejected.
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '201':
          $ref: '#/components/responses/Tokens'
        '409':
          description: Email is already registered (EMAIL_IN_USE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/auth/signin:
    post:
      tags: [Authentication]
      operationId: signIn
      summary: Verify credentials and start a new session
      description: Wrong passwords and unknown emails both return INVALID_CREDENTIALS (401). Ten attempts per normalized email are allowed per 15-minute window.
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '200':
          $ref: '#/components/responses/Tokens'
        default:
          $ref: '#/components/responses/Error'
  /api/auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshTokens
      summary: Exchange a refresh token for a new token pair
      description: |
        Submit only once and replace both stored tokens. Clients must serialize
        refresh requests: concurrent use of the same token triggers replay
        protection and revokes the session, including its access JWTs.
        Rotation never extends the original seven-day session lifetime.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{64}$'
      responses:
        '200':
          $ref: '#/components/responses/Tokens'
        default:
          $ref: '#/components/responses/Error'
  /api/auth/logout:
    post:
      tags: [Authentication]
      operationId: logOut
      summary: Revoke the current session and all its tokens
      description: |
        Requires a valid, unexpired access JWT and a live database session.
        Other sessions stay signed in. If the JWT has expired, refresh it before
        logout. Remove local tokens even when the session has already expired
        or the server returns 401. No request body is needed.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session revoked.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [message]
                    properties:
                      message:
                        type: string
                        example: Signed out successfully.
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [email, password]
            properties:
              email:
                type: string
                format: email
                maxLength: 254
                example: visitor@example.com
              password:
                type: string
                format: password
                minLength: 12
                maxLength: 128
                example: a-long-example-passphrase
  responses:
    Tokens:
      description: A safe user object and new token pair. Never log these tokens.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/AuthTokens'
    Error:
      description: |
        400 INVALID_JSON; 401 INVALID_CREDENTIALS, UNAUTHORIZED,
        INVALID_REFRESH_TOKEN, or REFRESH_TOKEN_REUSED; 403 FORBIDDEN;
        413 PAYLOAD_TOO_LARGE; 415 UNSUPPORTED_MEDIA_TYPE;
        422 VALIDATION_ERROR; 429 TOO_MANY_REQUESTS (Retry-After seconds);
        500 INTERNAL_ERROR; 503 SERVICE_UNAVAILABLE.
      headers:
        X-Request-Id:
          schema:
            type: string
        Retry-After:
          description: Present on 429 responses.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    User:
      type: object
      additionalProperties: false
      required: [id, email, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [USER, ADMIN]
        createdAt:
          type: string
          format: date-time
    AuthTokens:
      type: object
      additionalProperties: false
      required: [user, accessToken, refreshToken, tokenType, expiresIn, refreshExpiresAt]
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
        refreshToken:
          type: string
          pattern: '^[A-Za-z0-9_-]{64}$'
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          minimum: 1
          maximum: 900
          description: Access token lifetime in seconds, capped by session expiry.
        refreshExpiresAt:
          type: string
          format: date-time
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
              format: uuid
            fields:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
